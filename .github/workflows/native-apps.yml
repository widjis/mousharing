name: Native apps

on:
  push:
    paths:
      - 'native/**'
      - '.github/workflows/native-apps.yml'
  pull_request:
    paths:
      - 'native/**'
      - '.github/workflows/native-apps.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-apps-${{ github.ref }}
  cancel-in-progress: true

jobs:
  protocol-oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install protocol-test dependency
        run: python -m pip install 'cryptography>=46,<47'
      - name: Check deterministic fixtures
        run: |
          python native/shared/generate_fixtures.py
          git diff --exit-code -- native/shared/fixtures.json
      - name: Test handshake, crypto, framing, replay, and payload validation
        run: python -m unittest discover -s native/shared -p 'test_*.py' -v

  macos:
    runs-on: macos-latest
    timeout-minutes: 20
    env:
      MOUSHARING_FIXTURES: ${{ github.workspace }}/native/shared/fixtures.json
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install protocol-test dependency
        run: python -m pip install 'cryptography>=46,<47'
      - name: Show Swift toolchain
        run: swift --version
      - name: Build Swift protocol-test entry points
        run: swift build --package-path native/macos
      - name: Test actual Swift handshake and session against Python peer
        run: |
          native/macos/.build/debug/MousharingMac --self-test native/shared/fixtures.json
          python native/shared/swift_loopback.py
      - name: Test actual Swift CryptoKit implementation
        run: swift test --package-path native/macos
      - name: Build native application bundle
        run: bash native/macos/build-app.sh
      - name: Archive development build
        run: |
          mkdir -p artifacts
          ditto -c -k --sequesterRsrc --keepParent native/macos/dist/Mousharing.app artifacts/Mousharing-macOS-development.zip
      - uses: actions/upload-artifact@v7
        with:
          name: mousharing-macos-development-${{ runner.arch }}
          path: artifacts/Mousharing-macOS-development.zip
          if-no-files-found: error
          retention-days: 14

  windows:
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Select installed .NET 10 SDK
        shell: pwsh
        run: dotnet new globaljson --sdk-version 10.0.100 --roll-forward latestFeature --force
      - name: Install protocol-test dependency
        run: python -m pip install 'cryptography>=46,<47'
      - name: Build actual C# protocol checks
        run: dotnet build native/shared/dotnet/Mousharing.ProtocolChecks.csproj -c Release
      - name: Test C# vectors and cross-runtime TCP in both roles
        run: python native/shared/cross_runtime.py
      - name: Publish native WinUI application
        shell: pwsh
        run: |
          dotnet publish native/windows/Mousharing.Windows/Mousharing.Windows.csproj -c Release -r win-x64 -p:Platform=x64 --self-contained true -p:WindowsAppSDKSelfContained=true -o artifacts/windows-x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Inspect native resource packaging
        shell: pwsh
        run: |
          Get-ChildItem artifacts/windows-x64 -Recurse -File | Select-Object FullName,Length | Out-File artifacts/publish-files.txt
          Get-ChildItem artifacts/windows-x64 -Recurse -File | Where-Object Extension -in '.pri','.xbf','.xaml' | Select-Object FullName,Length | Format-Table -AutoSize
          $pri = Get-ChildItem artifacts/windows-x64 -Filter resources.pri -File | Select-Object -First 1
          $tool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Filter makepri.exe -Recurse -ErrorAction SilentlyContinue | Where-Object FullName -Match '\\x64\\' | Sort-Object FullName -Descending | Select-Object -First 1
          if ($pri -and $tool) {
            & $tool.FullName dump /if $pri.FullName /of artifacts/pri-dump.xml
            Select-String -Path artifacts/pri-dump.xml -Pattern 'MainWindow|App.xaml|App.xbf' -ErrorAction SilentlyContinue
          } else { Write-Host 'App resources.pri or makepri not present in publish environment.' }
          exit 0
      - name: Load the native WinUI window without starting sharing
        shell: pwsh
        run: |
          $exe = (Resolve-Path artifacts/windows-x64/Mousharing.Windows.exe).Path
          $process = Start-Process -FilePath $exe -ArgumentList '--ui-smoke-test' -PassThru -RedirectStandardOutput artifacts/ui-smoke-stdout.txt -RedirectStandardError artifacts/ui-smoke-stderr.txt
          if (-not $process.WaitForExit(20000)) {
            Stop-Process -Id $process.Id -Force
            throw 'Native WinUI startup timed out.'
          }
          Get-Content artifacts/ui-smoke-stderr.txt -ErrorAction SilentlyContinue
          if ($process.ExitCode -ne 0) { throw "Native WinUI startup failed with exit code $($process.ExitCode)." }
          Write-Host 'PASS native WinUI window loaded; sharing and clipboard remained inactive.'
      - uses: actions/upload-artifact@v7
        with:
          name: mousharing-windows-x64-development
          path: artifacts/windows-x64/
          if-no-files-found: error
          retention-days: 14

      - name: Save startup diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mousharing-windows-startup-diagnostics
          path: |
            artifacts/ui-smoke-*.txt
            artifacts/publish-files.txt
            artifacts/pri-dump.xml
          if-no-files-found: ignore
          retention-days: 7
